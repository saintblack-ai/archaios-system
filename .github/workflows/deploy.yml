name: Deploy Vite Client To GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Verify production environment
        run: |
          missing=0

          if [ -z "${VITE_BACKEND_URL}" ]; then
            echo "::error::Missing required GitHub Actions variable VITE_BACKEND_URL."
            missing=1
          fi

          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "::error::Missing required GitHub Actions variable VITE_SUPABASE_URL."
            missing=1
          fi

          if [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Missing required GitHub Actions secret VITE_SUPABASE_ANON_KEY."
            missing=1
          fi

          if [ "${missing}" -ne 0 ]; then
            echo "Required GitHub Pages production configuration is incomplete."
            exit 1
          fi

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Add GitHub Pages SPA fallback
        run: cp client/dist/index.html client/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
