<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05020a" />
    <title>ARCHAIOS Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #05020a;
        color: #f8f7ff;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(180deg, #0f061d 0%, #05020a 100%);
        background-size: 32px 32px, 32px 32px, auto;
      }

      main {
        width: min(520px, 100%);
        border: 1px solid rgba(218, 203, 255, 0.38);
        border-radius: 24px;
        padding: 28px;
        background: rgba(19, 11, 37, 0.92);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      p {
        color: #c8c0e4;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p>ARCHAIOS OS</p>
      <h1>Offline command shell ready.</h1>
      <p>The installed workspace will reconnect to live intelligence when the network returns.</p>
    </main>
  </body>
</html>
